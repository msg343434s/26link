<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verify you are human</title>
<style>
  /* Full-page background */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Centered box */
  .box {
    background: #fff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    text-align: center;
    width: 300px;
  }

  h2 {
    margin-bottom: 20px;
    font-size: 20px;
    color: #333;
  }

  label {
    display: block;
    font-size: 16px;
    margin-bottom: 15px;
    cursor: pointer;
    color: #555;
  }

  input[type="radio"] {
    margin-right: 10px;
    cursor: pointer;
  }

  .loading {
    margin-top: 20px;
    font-size: 16px;
    color: #007bff;
    display: none;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Prove you are human?</h2>

  <form id="humanForm">
    <label>
      <input type="radio" name="human" value="yes">
      I am a human
    </label>
    <div class="loading" id="loading">Loading, please wait...</div>
  </form>
</div>

<script>
const rid = location.pathname.split("/").pop();
if (!rid || rid.length < 4) {
  document.body.innerHTML = "Invalid link.";
  throw new Error("Invalid rid");
}

const form = document.getElementById("humanForm");
const loading = document.getElementById("loading");

form.addEventListener("change", async (e) => {
  const checked = form.querySelector('input[name="human"]:checked');
  if (!checked) return;

  // Show loading
  loading.style.display = "block";

  // Send verify request
  try {
    const payload = { rid, humanConfirmed: true };
    const res = await fetch("/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      document.body.innerHTML = "Access denied.";
      return;
    }

    const json = await res.json();
    if (json.ok && json.token) {
      // Redirect to final page
      location.href = "/go?token=" + encodeURIComponent(json.token);
    } else {
      document.body.innerHTML = "Access denied.";
    }

  } catch (err) {
    document.body.innerHTML = "Access denied.";
  }
});
</script>

</body>
</html>
