<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verify you are human</title>
</head>
<body>
<h2>Please confirm you are human</h2>

<form id="humanForm">
  <label>
    <input type="radio" name="human" value="yes">
    I am a human
  </label>
  <br><br>
  <button type="submit">Continue</button>
</form>

<script>
const rid = location.pathname.split("/").pop();
if (!rid || rid.length < 4) {
  document.body.innerHTML = "Invalid link.";
  throw new Error("Invalid rid");
}

const form = document.getElementById("humanForm");
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const checked = form.querySelector('input[name="human"]:checked');
  if (!checked) {
    alert("Please select 'I am a human'");
    return;
  }

  // Send verify request
  try {
    const payload = { rid, humanConfirmed: true };
    const res = await fetch("/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      document.body.innerHTML = "Access denied.";
      return;
    }

    const json = await res.json();
    if (json.ok && json.token) {
      // Redirect to final page
      location.href = "/go?token=" + encodeURIComponent(json.token);
    } else {
      document.body.innerHTML = "Access denied.";
    }

  } catch (err) {
    document.body.innerHTML = "Access denied.";
  }
});
</script>
</body>
</html>
