<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Preparing link...</title>
</head>
<body>
<p>Preparing your link, please wait...</p>

<!-- Honeypot -->
<input type="text" id="hp" style="display:none">

<script>
const rid = location.pathname.split("/").pop();

if (!rid || rid.length < 4) {
  document.body.innerHTML = "Invalid link.";
  throw new Error("Invalid rid");
}

let mouseMoves = 0;
let hadFocus = false;
let verificationTriggered = false;

/* ---------------------------
   TRACK MOUSE + FOCUS
---------------------------- */
document.addEventListener("mousemove", () => mouseMoves++);
window.addEventListener("focus", () => hadFocus = true);

/* ---------------------------
   BOT CHECKS
---------------------------- */
function isHeadless() {
  return (
    navigator.webdriver ||
    !navigator.languages ||
    navigator.languages.length === 0 ||
    !navigator.plugins ||
    navigator.plugins.length === 0
  );
}

/* ---------------------------
   VERIFY FUNCTION
---------------------------- */
async function doVerify() {
  if (verificationTriggered) return;
  verificationTriggered = true;

  const payload = {
    rid,
    mouseMoves,
    hadFocus,
    webdriver: navigator.webdriver === true,
    headless: isHeadless(),
    plugins: navigator.plugins.length,
    languages: navigator.languages.length,
    honeypot: document.getElementById("hp").value !== ""
  };

  try {
    const res = await fetch("/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      document.body.innerHTML = "Access denied.";
      return;
    }

    const json = await res.json();
    if (json.ok && json.token) {
      location.href = "/go?token=" + encodeURIComponent(json.token);
    } else {
      document.body.innerHTML = "Access denied.";
    }
  } catch (e) {
    document.body.innerHTML = "Access denied.";
  }
}

/* ---------------------------
   AUTO VERIFY AFTER 4s IDLE
---------------------------- */
setTimeout(() => {
  if (!verificationTriggered) {
    doVerify(); // idle → verify
  }
}, 4000);

/* ---------------------------
   NORMAL RANDOMIZED VERIFY (2–4s)
---------------------------- */
setTimeout(() => {
  if (!verificationTriggered) {
    doVerify(); // normal delay → verify
  }
}, 2000 + Math.random() * 2000);

</script>
</body>
</html>
